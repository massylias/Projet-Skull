# ===== Application =====
spring.application.name=Projet-Skull
server.port=8080

# ===== Base de donnees MariaDB =====
# En local : utilise localhost:3306
# En Docker : utilise les variables d'environnement
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/skull}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:skull}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:skull}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== Logs =====
logging.level.com.skull=DEBUG
logging.level.org.springframework.web=INFO